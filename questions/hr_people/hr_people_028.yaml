id: hr_people_028
schema: hr_people
question: >-
  For reviews 1 through 20, list the competencies they score as a comma-
  separated string in alphabetical order, without spaces (an empty string when
  none). Return review_id and the string.
category: dialect_sensitive
divergence: syntax
divergence_note: >-
  Map keys as a sorted string: OBJECT_KEYS and ARRAY_TO_STRING on Snowflake,
  map_keys and array_join on Databricks.
features: [struct_map_access, array_fn, string_fn]
difficulty: medium
gold_sql:
  snowflake: |
    SELECT review_id, ARRAY_TO_STRING(ARRAY_SORT(OBJECT_KEYS(scores)), ',') AS competencies
    FROM reviews
    WHERE review_id BETWEEN 1 AND 20
  databricks: |
    SELECT review_id, array_join(array_sort(map_keys(scores)), ',') AS competencies
    FROM reviews
    WHERE review_id BETWEEN 1 AND 20
order_matters: false
float_tolerance: 0
status: draft
