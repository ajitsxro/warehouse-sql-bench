id: hr_people_018
schema: hr_people
question: >-
  For each number of skills that occurs, how many employees list that many?
  Leave out numbers no employee has. Return the number of skills listed and
  the number of employees.
category: portable
divergence: none
features: [array_fn, aggregate]
difficulty: easy
gold_sql:
  snowflake: |
    SELECT ARRAY_SIZE(skills) AS skill_count, COUNT(*) AS employees
    FROM employees
    GROUP BY ARRAY_SIZE(skills)
  databricks: |
    SELECT ARRAY_SIZE(skills) AS skill_count, COUNT(*) AS employees
    FROM employees
    GROUP BY ARRAY_SIZE(skills)
order_matters: false
float_tolerance: 0
status: verified
verified_by: "ajitsxro"
verified_at: 2026-11-10
