id: ecommerce_028
schema: ecommerce
question: >-
  For each number of entries that occurs in products' specs, how many
  products have that many? Leave out numbers no product has. Return the number
  of entries and the number of products.
category: dialect_sensitive
divergence: syntax
divergence_note: >-
  Size of a map: ARRAY_SIZE(OBJECT_KEYS(...)) on Snowflake, size(...) on
  Databricks.
features: [struct_map_access, aggregate]
difficulty: easy
gold_sql:
  snowflake: |
    SELECT ARRAY_SIZE(OBJECT_KEYS(specs)) AS spec_entries, COUNT(*) AS products
    FROM products
    GROUP BY ARRAY_SIZE(OBJECT_KEYS(specs))
  databricks: |
    SELECT size(specs) AS spec_entries, COUNT(*) AS products
    FROM products
    GROUP BY size(specs)
order_matters: false
float_tolerance: 0
status: verified
verified_by: "ajitsxro"
verified_at: 2026-11-10
