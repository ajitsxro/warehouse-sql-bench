id: ecommerce_001
schema: ecommerce
question: >-
  How many customers are there in each country? Country codes can have stray
  spaces or lower-case letters, so report them trimmed and upper-cased. Return
  the country code and the number of customers.
category: portable
divergence: none
features: [aggregate, string_fn]
difficulty: easy
gold_sql:
  snowflake: |
    SELECT UPPER(TRIM(country)) AS country, COUNT(*) AS customers
    FROM customers
    GROUP BY UPPER(TRIM(country))
  databricks: |
    SELECT UPPER(TRIM(country)) AS country, COUNT(*) AS customers
    FROM customers
    GROUP BY UPPER(TRIM(country))
order_matters: false
float_tolerance: 0
status: draft
