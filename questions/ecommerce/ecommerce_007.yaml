id: ecommerce_007
schema: ecommerce
question: >-
  Which 10 products sold the most units (sum of quantity over all order
  items)? Break ties by the lower product_id. Return product_id, product_name
  and units, highest first.
category: portable
divergence: none
features: [join, aggregate]
difficulty: medium
gold_sql:
  snowflake: |
    SELECT p.product_id, p.product_name, SUM(oi.quantity) AS units
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    GROUP BY p.product_id, p.product_name
    ORDER BY units DESC, p.product_id
    LIMIT 10
  databricks: |
    SELECT p.product_id, p.product_name, SUM(oi.quantity) AS units
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    GROUP BY p.product_id, p.product_name
    ORDER BY units DESC, p.product_id
    LIMIT 10
order_matters: true
float_tolerance: 0
status: draft
