name: saas_subscriptions
description: >
  A B2B software company: accounts subscribe to plans, are invoiced per
  subscription, and generate product usage events. An account can have
  several subscriptions over time; ended_at is NULL while one is active.
  Subscription periods are generated independently, so one account's
  periods may overlap.

tables:
  - name: plans
    rows: 12
    edge_rows: 12
    primary_key: plan_id
    columns:
      - {name: plan_id, type: int, gen: {distribution: sequence}}
      - name: plan_name
        type: string
        gen:
          distribution: cycle
          values: [Free, Starter, Team, Business, Enterprise, Enterprise Plus]
      - name: billing_period
        type: string
        gen:
          distribution: cycle
          values: [monthly, monthly, monthly, monthly, monthly, monthly,
                   annual, annual, annual, annual, annual, annual]
      - name: tier_rank
        type: int
        gen: {distribution: cycle, values: [1, 2, 3, 4, 5, 6]}
      - name: list_price
        type: decimal(10,2)
        description: Price per seat for one billing period.
        gen:
          distribution: cycle
          values: [0, 12, 25, 45, 80, 120, 0, 120, 250, 450, 800, 1200]
      - name: included_features
        type: array<string>
        gen:
          shape:
            type: array
            min_items: 1
            max_items: 4
            element: {type: string, values: [sso, audit_log, api, sandbox, priority_support]}

  - name: accounts
    rows: 8000
    edge_rows: 300
    primary_key: account_id
    columns:
      - {name: account_id, type: bigint, gen: {distribution: sequence}}
      - {name: company_name, type: string, gen: {faker: company, cardinality: 8000}}
      - name: industry
        type: string
        gen:
          values: [software, finance, healthcare, retail, education, manufacturing, media]
          weights: [25, 15, 12, 14, 10, 14, 10]
      - name: country
        type: string
        gen: {values: [US, GB, DE, FR, CA, AU, IN, JP], weights: [45, 12, 10, 7, 8, 5, 8, 5]}
      - name: employee_band
        type: string
        gen: {values: [1-10, 11-50, 51-200, 201-1000, 1000+], weights: [30, 30, 20, 13, 7]}
      - {name: created_at, type: timestamp_tz, gen: {min: 2020-01-01, max: 2024-06-30}}
      - {name: account_owner, type: string, gen: {faker: name, cardinality: 40}}

  - name: subscriptions
    rows: 20000
    edge_rows: 400
    primary_key: subscription_id
    columns:
      - {name: subscription_id, type: bigint, gen: {distribution: sequence}}
      - name: account_id
        type: bigint
        references: accounts.account_id
        gen: {distribution: zipf, exponent: 1.05}
      - name: plan_id
        type: int
        references: plans.plan_id
        gen: {distribution: zipf, exponent: 1.3}
      - {name: started_at, type: timestamp_tz, gen: {min: 2020-01-01, max: 2024-12-31}}
      - name: ended_at
        type: timestamp_tz
        nullable: true
        description: NULL while the subscription is active.
        gen: {after: started_at, max_gap_days: 900, null_rate: 0.45}
      - name: seats
        type: int
        gen: {distribution: lognormal, mean: 2.0, sigma: 1.0, min: 1, max: 5000}
      - name: discount_pct
        type: decimal(5,2)
        nullable: true
        gen: {min: 5, max: 40, null_rate: 0.75}

  - name: invoices
    rows: 120000
    edge_rows: 800
    primary_key: invoice_id
    columns:
      - {name: invoice_id, type: bigint, gen: {distribution: sequence}}
      - name: subscription_id
        type: bigint
        references: subscriptions.subscription_id
        gen: {distribution: uniform}
      - {name: issued_at, type: timestamp_tz, gen: {min: 2020-01-01, max: 2024-12-31}}
      - {name: due_at, type: timestamp_tz, gen: {after: issued_at, max_gap_days: 30}}
      - name: paid_at
        type: timestamp_tz
        nullable: true
        description: NULL for unpaid invoices.
        gen: {after: issued_at, max_gap_days: 60, null_rate: 0.12}
      - name: amount
        type: decimal(12,2)
        gen: {distribution: lognormal, mean: 6.0, sigma: 1.2, min: 0, max: 250000}
      - name: tax_amount
        type: decimal(12,2)
        nullable: true
        gen: {distribution: lognormal, mean: 3.5, sigma: 1.0, max: 50000, null_rate: 0.3}
      - name: currency
        type: string
        gen: {values: [USD, EUR, GBP], weights: [70, 20, 10]}

  - name: usage_events
    rows: 500000
    edge_rows: 1500
    columns:
      - name: account_id
        type: bigint
        references: accounts.account_id
        gen: {distribution: zipf, exponent: 1.1}
      - {name: event_ts, type: timestamp_tz, gen: {min: 2023-01-01, max: 2024-12-31}}
      - name: event_type
        type: string
        gen:
          values: [api_call, login, export, report_run, seat_added, integration_sync]
          weights: [50, 20, 8, 12, 2, 8]
      - name: quantity
        type: int
        gen: {distribution: lognormal, mean: 1.0, sigma: 1.2, min: 1, max: 10000}
      - name: payload
        type: variant
        nullable: true
        gen:
          null_rate: 0.03
          shape:
            type: object
            fields:
              feature: {type: string, values: [dashboards, alerts, billing, search, admin]}
              duration_ms: {type: int, min: 5, max: 30000, optional: 0.2}
              client:
                type: object
                optional: 0.1
                fields:
                  platform: {type: string, values: [web, ios, android, cli]}
                  version: {type: string, pattern: "#.##.#"}
              tags:
                type: array
                max_items: 3
                element: {type: string, values: [beta, internal, automated, trial]}
              error:
                type: object
                optional: 0.9
                fields:
                  code: {type: string, pattern: "E###"}
                  retryable: {type: bool}
