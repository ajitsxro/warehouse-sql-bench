[project]
name = "warehouse-sql-bench"
version = "0.1.0"
description = "Execution-scored text-to-SQL benchmark for Snowflake and Databricks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "databricks-sdk>=0.164.0",
    "databricks-sql-connector>=4.9.0",
    "duckdb>=1.1",
    "faker>=40.44.0",
    "google-genai>=3.1.0",
    "numpy>=2.4.6",
    "openai>=3.49.0",
    "pyarrow>=17",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "snowflake-connector-python>=5.2.0",
    "sqlglot>=30.29.0",
    "typer>=0.12",
]

[project.scripts]
bench = "sqlbench.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Project style prefers explicit if/else blocks over ternaries.
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# databricks-sql-connector declares no types on its exception constructors.
untyped_calls_exclude = ["databricks.sql.exc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
